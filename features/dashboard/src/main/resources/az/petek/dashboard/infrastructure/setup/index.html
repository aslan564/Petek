<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="petek-token" content="{{TOKEN}}">
<title>Pətək — hansı sayt?</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2.5 27.7 9.25v13.5L16 29.5 4.3 22.75V9.25z' fill='%23f59e0b'/%3E%3Cpath d='M16 9.5 21.6 12.75v6.5L16 22.5l-5.6-3.25v-6.5z' fill='%23fff' opacity='.9'/%3E%3C/svg%3E">
<style nonce="{{NONCE}}">
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --border: #e3e8ef;
  --text: #0f172a;
  --muted: #64748b;
  --brand: #f59e0b;
  --brand-ink: #1f1300;
  --red: #dc2626;
  --sans: "Inter", "Segoe UI", system-ui, -apple-system, "Roboto", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1020;
    --surface: #121a2c;
    --border: #1f2a40;
    --text: #e7edf7;
    --muted: #8d9bb5;
    --brand: #fbbf24;
    --red: #f87171;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; font: 15px/1.55 var(--sans); color: var(--text); background: var(--bg); }
main { width: 100%; max-width: 540px; padding: 28px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); box-shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 2px 10px rgba(15, 23, 42, .05); }
h1 { margin: 0 0 8px; font-size: 21px; line-height: 1.3; }
p { margin: 0 0 18px; color: var(--muted); }
code { font-family: var(--mono); font-size: .92em; }
label { display: block; margin-bottom: 6px; font-weight: 650; }
input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font: inherit; font-family: var(--mono); color: var(--text); background: transparent; }
input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
button { width: 100%; margin-top: 14px; padding: 11px 14px; border: 0; border-radius: 10px; font: inherit; font-weight: 700; color: var(--brand-ink); background: var(--brand); cursor: pointer; }
button[disabled] { opacity: .65; cursor: progress; }
.error { min-height: 1.5em; margin-top: 12px; color: var(--red); overflow-wrap: anywhere; }
.note { margin: 18px 0 0; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Hansı saytı test edək?</h1>
  <p>Pətək yalnız verdiyiniz saytı test edir. Ünvanı yazın: sayt yoxlanılacaq, ünvan <code>.env</code> faylına yazılacaq və panel açılacaq.</p>
  <form id="setup" novalidate>
    <label for="target">Saytın ünvanı</label>
    <input id="target" name="target" type="url" inputmode="url" autocomplete="url" spellcheck="false" placeholder="https://staging.example.com" required autofocus>
    <button id="save" type="submit">Yadda saxla və paneli aç</button>
    <div id="error" class="error" role="alert"></div>
  </form>
  <p class="note">Yalnız sizə məxsus pre-production və ya staging saytını, yalnız test hesabları ilə verin — heç vaxt real istifadəçilərin hesablarını.</p>
</main>
<script nonce="{{NONCE}}">
(function () {
  var token = document.querySelector('meta[name="petek-token"]').content;
  var form = document.getElementById('setup');
  var input = document.getElementById('target');
  var button = document.getElementById('save');
  var error = document.getElementById('error');
  var label = button.textContent;
  var local = /^http:\/\/(127\.0\.0\.1|localhost|\[::1\]):\d+\/?$/;

  function reset(message) {
    error.textContent = message;
    button.disabled = false;
    button.textContent = label;
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    var value = input.value.trim();
    if (!value) return reset('Saytın ünvanını yazın.');
    // A bare host (shop.example.com) is meant as its https address.
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) value = 'https://' + value;
    input.value = value;
    error.textContent = '';
    button.disabled = true;
    button.textContent = 'Sayt yoxlanılır…';
    fetch('/api/setup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Petek-Token': token },
      body: JSON.stringify({ target: value })
    }).then(function (response) {
      return response.json().then(function (body) { return { ok: response.ok, body: body || {} }; });
    }).then(function (result) {
      if (result.ok && typeof result.body.panel === 'string' && local.test(result.body.panel)) {
        button.textContent = 'Panel açılır…';
        location.href = result.body.panel;
        return;
      }
      reset(result.body.error || 'Alınmadı; yenidən cəhd edin.');
    }).catch(function () {
      reset('Pətək cavab vermədi: terminalda işlədiyini yoxlayın.');
    });
  });
})();
</script>
</body>
</html>
