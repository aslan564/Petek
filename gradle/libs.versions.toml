[versions]
kotlin = "2.4.20"
coroutines = "1.11.0"
serialization = "1.11.0"
ktor = "3.6.0"
playwright = "1.63.0"
kaml = "0.104.0"
clikt = "5.1.0"
mordant = "3.1.0"
sqlite = "3.53.4.0"
exposed = "1.5.0"
kotlinx-html = "0.12.0"
kotlin-logging = "8.0.4"
logback = "1.6.4"
anthropic = "2.65.0"
# IMAP reader for the owner's own test inbox (Faza 16); approved by the owner 2026-09-26 (AGENTS.md rule 11).
angus-mail = "2.0.5"
junit = "6.1.3"
kotest = "6.2.5"
konsist = "0.17.3"
spotless = "8.10.2"
ktlint = "1.8.0"
kover = "0.9.9"
jdk = "25"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
