# Pətək in a project's GitLab CI (R15, Faza 12): runs an approved campaign against the staging deployment with the
# published image. Add to .gitlab-ci.yml (or include it) and set the CI/CD variables PETEK_TARGET (the staging URL),
# PETEK_TEST_TOKEN (the /test/... API token, masked), PETEK_IDENTITY_SECRET (any random string, >= 16 characters,
# masked) and, for the tester agents' AI, whatever your project uses (R09, .env.example): PETEK_LLM_PROVIDER,
# PETEK_LLM_MODEL, PETEK_LLM_BASE_URL and PETEK_LLM_API_KEY (masked). Pətək picks no AI vendor for you.
#
# Exit codes: 0 every run PASSED, 1 a run FAILED (findings in the report), 2 nothing could start, 3 a run did not pass
# only because some checks could not be decided (nothing failed; the report names them). The JUnit XML shows
# the steps in the merge request's test report; the HTML reports and the SARIF file stay as artifacts.
petek:
  stage: test
  image:
    name: ghcr.io/aslan564/petek:0.3.1
    entrypoint: [""]
  services:
    - name: axllent/mailpit
      alias: mailpit
  variables:
    PETEK_MAILPIT_URL: http://mailpit:8025
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual
  script:
    - petek --json doctor
    - petek --json run scenarios/my-site.yaml --testers 10 --ci
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - evidence/
    reports:
      junit: evidence/**/report/junit.xml
