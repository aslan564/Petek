# Target profile of KadroHR (docs/PLAN.md Faza 10, ADR-0010): PETEK_TARGET=kadrohr selects it, and a run or exploration
# whose site is https://staging.kadrohr.com uses these settings. Secrets are ${VARIABLE} references to .env, never values.
target:
  name: kadrohr
  url: https://staging.kadrohr.com
  # The /test/... API lives on the API host (docs/KADROHR_READINESS.md, open question).
  api_url: https://api.staging.kadrohr.com
  production_hosts: [kadrohr.com, www.kadrohr.com]
  mail: {source: test-api, domain: test.kadrohr.com}
  test_api: {token: '${PETEK_TEST_TOKEN}'}
  # Tried in this order by the explorer: a test company through the test API, then the owner's accounts, then
  # registering by itself, then looking around without an account.
  sign_in: [test_company, own_accounts, self_register, anonymous]
  # accounts:
  #   - {role: admin, email: owner@example.com, password: '${PETEK_ACC_KADROHR_ADMIN}'}
  profile: scenarios/kadrohr.yaml
