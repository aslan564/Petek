# Released by hand from main (Actions -> Release -> Run workflow), which tags v<version> and attaches the platform
# bundles (petek-<version>-<platform>.tar.gz|zip), petek-<version>-any-jdk25.zip and SHA256SUMS.
version=0.3.1
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon.idletimeout=900000
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
