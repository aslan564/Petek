name: Release

# Publishes a GitHub Release with the platform bundles (petek-<version>-<platform>.tar.gz, .zip on Windows: launcher,
# jars, a jlink runtime and the platform's Playwright driver, so the machine needs no JDK) and the generic distribution
# (petek-<version>-any-jdk25.zip, runs wherever JDK 25 is on PATH), with a SHA256SUMS file over all of them; then the
# Docker image ghcr.io/<owner>/petek:<version> (linux/amd64 + linux/arm64, from the two Linux bundles on Playwright's
# image) and, when NPM_TOKEN is set, the npm launcher.
# Three ways in: a push to main whose `version` in gradle.properties has no release yet (main only receives develop,
# so a version bump on main is the release), a tag v<version> pushed to main, or a manual run on main with the
# version. The tree is built and tested first, so a release is never cut from a red tree; the version must match
# gradle.properties, and a version that already has its tag is left alone. Each bundle is built on its own platform
# (jlink cannot cross-build), and every bundle's launcher is started once before anything is published.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (must equal `version` in gradle.properties, e.g. 0.1.0)
        required: true
        type: string

permissions:
  contents: write
  packages: write

defaults:
  run:
    shell: bash

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version and check it against gradle.properties
        id: version
        run: |
          FILE=$(grep -E '^version=' gradle.properties | cut -d= -f2)
          case "${GITHUB_EVENT_NAME}:${GITHUB_REF}" in
            workflow_dispatch:*) V="${{ inputs.version }}" ;;
            push:refs/tags/*)    V="${GITHUB_REF_NAME#v}" ;;
            push:refs/heads/*)   V="$FILE" ;;
          esac
          [ "$V" = "$FILE" ] || { echo "release version '$V' but gradle.properties says '$FILE'"; exit 1; }
          NPM=$(node -p "require('./launcher/package.json').version")
          [ "$V" = "$NPM" ] || { echo "release version '$V' but launcher/package.json says '$NPM' (npx petek@$V must run this release)"; exit 1; }
          case "${GITHUB_REF}" in refs/tags/*|refs/heads/main) ;; *) echo "releases are cut from main, not ${GITHUB_REF_NAME}"; exit 1 ;; esac
          if git ls-remote --exit-code --tags origin "refs/tags/v${V}" > /dev/null && [ "${GITHUB_REF}" != "refs/tags/v${V}" ]; then
            echo "v${V} is already released; bump version in gradle.properties to release again"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  test:
    name: Build and test the tree, generic distribution
    needs: version
    if: needs.version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          cache-read-only: true

      - name: Install the Chromium Playwright needs (browser tests run in the normal build)
        run: |
          PW=$(grep -m1 -E '^playwright = "' gradle/libs.versions.toml | cut -d'"' -f2)
          npx --yes "playwright@${PW}" install --with-deps chromium

      - name: Build, test and pack the generic distribution
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: ./gradlew build :app:distZip --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: generic
          path: app/build/distributions/petek-*-any-jdk25.zip
          if-no-files-found: error
          retention-days: 3

  bundle:
    name: Bundle ${{ matrix.platform }}
    needs: [version, test]
    if: needs.version.outputs.skip == 'false'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-latest }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
          - { platform: mac-arm64, os: macos-latest }
          - { platform: win-x64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (the bundle's runtime is linked from it)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build the bundle
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: ./gradlew :app:bundle -Ppetek.platform=${{ matrix.platform }} --no-daemon --console=plain

      - name: Start the bundle's launcher (no JDK on PATH)
        if: runner.os != 'Windows'
        run: |
          tar xzf app/build/distributions/petek-*-${{ matrix.platform }}.tar.gz -C "$RUNNER_TEMP"
          env -u JAVA_HOME PATH=/usr/bin:/bin "$RUNNER_TEMP"/petek-*-${{ matrix.platform }}/bin/petek --help

      - name: Start the bundle's launcher (no JDK on PATH)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive (Get-Item app/build/distributions/petek-*-win-x64.zip) -DestinationPath $env:RUNNER_TEMP
          $env:JAVA_HOME = ""
          $env:Path = "C:\Windows\System32"
          & (Get-Item "$env:RUNNER_TEMP\petek-*-win-x64\bin\petek.cmd") --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            app/build/distributions/petek-*-${{ matrix.platform }}.tar.gz
            app/build/distributions/petek-*-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish the release
    needs: [version, test, bundle]
    if: needs.version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The npm launcher is published only when the repository has the token (Settings → Secrets → NPM_TOKEN);
      # without it the release still happens and `npx petek` is skipped, which the job log says.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum petek-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release (creates the tag when it does not exist yet)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Pətək ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          body: |
            Pətək runs next to the site under test, never inside its build. Pick the archive for your machine
            (no JDK needed) or the generic one (needs JDK 25 on PATH), extract it anywhere, then from the site's directory:

            | Machine | Archive |
            |---|---|
            | Linux x64 | `petek-${{ needs.version.outputs.version }}-linux-x64.tar.gz` |
            | Linux arm64 | `petek-${{ needs.version.outputs.version }}-linux-arm64.tar.gz` |
            | macOS Apple silicon | `petek-${{ needs.version.outputs.version }}-mac-arm64.tar.gz` |
            | Windows x64 | `petek-${{ needs.version.outputs.version }}-win-x64.zip` |
            | Anything with JDK 25 (Intel Mac, ...) | `petek-${{ needs.version.outputs.version }}-any-jdk25.zip` |

            ```
            tar xzf petek-${{ needs.version.outputs.version }}-linux-x64.tar.gz     # or unzip
            cd my-site && cp ../petek-${{ needs.version.outputs.version }}-linux-x64/.env.example .env   # fill PETEK_TARGET
            ../petek-${{ needs.version.outputs.version }}-linux-x64/bin/petek doctor   # target, Chromium, inbox, test API, AI (Claude Code CLI logged in, or ANTHROPIC_API_KEY)
            ../petek-${{ needs.version.outputs.version }}-linux-x64/bin/petek panel    # the web panel at http://127.0.0.1:7070
            ```

            Or, with Node.js installed: `npx petek@${{ needs.version.outputs.version }} doctor` downloads this bundle once and runs it.

            Or in Docker (Chromium included; mount the project as /work):
            `docker run --rm -v "$PWD:/work" --env-file .env ghcr.io/${{ github.repository_owner }}/petek:${{ needs.version.outputs.version }} doctor`

            Chromium is downloaded by Playwright on first use. Checksums: `SHA256SUMS`. Licence: Business Source License 1.1 (see LICENSE).

      - name: Lay out the Linux bundles for the image (one directory per architecture)
        run: |
          docker/prepare-context.sh dist/petek-*-linux-x64.tar.gz amd64
          docker/prepare-context.sh dist/petek-*-linux-arm64.tar.gz arm64
          echo "playwright=$(grep -m1 -E '^playwright = "' gradle/libs.versions.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image for both Linux architectures
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: PLAYWRIGHT_VERSION=${{ env.playwright }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/petek:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/petek:latest

      - name: Publish the npm launcher (npx petek), when NPM_TOKEN is set
        if: env.NPM_TOKEN != ''
        working-directory: launcher
        run: |
          npm test
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          npm publish --access public

      - name: npm launcher not published
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN is not set; the release is published without the npm launcher (add the secret to publish npx petek)."
