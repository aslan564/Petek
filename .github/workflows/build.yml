name: Build

# Minutes are spent deliberately (the repository is public, so standard runners are free, but a run is still
# a run): a push to an integration branch runs once, never again as the pull request it belongs to; pull
# requests run only for feature branches heading into develop; the expensive end-to-end job runs only on a
# push to develop or by hand; a newer push cancels the run in progress.
on:
  push:
    branches: [develop, petek-mvp]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    branches: [develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
  workflow_dispatch:
    inputs:
      e2e:
        description: Also run the end-to-end job
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, lint, licence headers, unit and architecture tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          # develop is the integration branch, so it writes the dependency cache every other run reads.
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Install the Chromium Playwright needs (browser tests run in the normal build)
        run: |
          PW=$(grep -m1 -E '^playwright = "' gradle/libs.versions.toml | cut -d'"' -f2)
          echo "Playwright ${PW}"
          npx --yes "playwright@${PW}" install --with-deps chromium

      - name: Build
        # Chromium is already installed with the exact version; the Java driver must not fetch every browser again.
        # (Kept out of the install step: the Playwright CLI honours the variable too and would skip the download.)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: ./gradlew build --no-daemon --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  e2e:
    name: End-to-end against the fake target (real Chromium)
    runs-on: ubuntu-latest
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.e2e)
    timeout-minutes: 30
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Install the Chromium Playwright needs
        run: |
          PW=$(grep -m1 -E '^playwright = "' gradle/libs.versions.toml | cut -d'"' -f2)
          npx --yes "playwright@${PW}" install --with-deps chromium
      - name: End-to-end runs against the fake target (panel, e2e module, 30 real Chromium contexts)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: ./gradlew e2eTest --no-daemon --console=plain
      - name: Isolation proof at scale (5 000 testers through the orchestrator)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: ./gradlew :features:orchestration:test -Dpetek.isolation.testers=5000 --no-daemon --console=plain
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            app/build/reports/tests/
            app/build/panel-screenshots/
            e2e/build/reports/tests/
            features/browser/build/reports/tests/
            features/orchestration/build/reports/tests/
          retention-days: 7
