name: Build

# Runs only by hand (Actions → Build → Run workflow): the owner asked that no push spends Actions minutes and that
# nothing is deployed before everything is finished. The gate on every commit is the local `./gradlew spotlessApply
# build` (CLAUDE.md); this workflow is the same build on a clean runner, plus the bundle, the Docker image and, when
# asked, the end-to-end job. A newer manual run cancels the one in progress.
on:
  workflow_dispatch:
    inputs:
      e2e:
        description: Also run the end-to-end job (fake target, real Chromium, 5 000-tester isolation proof)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, lint, licence headers, unit and architecture tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          cache-read-only: false

      - name: Install the Chromium Playwright needs (browser tests run in the normal build)
        run: |
          PW=$(grep -m1 -E '^playwright = "' gradle/libs.versions.toml | cut -d'"' -f2)
          echo "Playwright ${PW}"
          npx --yes "playwright@${PW}" install --with-deps chromium

      - name: Build
        # Chromium is already installed with the exact version; the Java driver must not fetch every browser again.
        # (Kept out of the install step: the Playwright CLI honours the variable too and would skip the download.)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: ./gradlew build --no-daemon --console=plain

      - name: The npm launcher (npx petek) downloads, verifies and starts a bundle from a local stand-in release
        run: node --test launcher/test/*.test.js

      - name: Platform bundle (jlink runtime, one Playwright driver) builds and its launcher starts without a JDK
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          ./gradlew :app:bundle --no-daemon --console=plain
          tar xzf app/build/distributions/petek-*-linux-x64.tar.gz -C "$RUNNER_TEMP"
          env -u JAVA_HOME PATH=/usr/bin:/bin "$RUNNER_TEMP"/petek-*-linux-x64/bin/petek --help

      - name: The Docker image builds from the bundle and its Chromium starts (doctor's browser row is green)
        run: |
          docker/prepare-context.sh app/build/distributions/petek-*-linux-x64.tar.gz amd64
          PW=$(grep -m1 -E '^playwright = "' gradle/libs.versions.toml | cut -d'"' -f2)
          docker build --build-arg "PLAYWRIGHT_VERSION=${PW}" -f docker/Dockerfile -t petek:ci docker/
          docker run --rm petek:ci --help > /dev/null
          docker run --rm -e PETEK_TARGET=http://127.0.0.1:9 -e PETEK_IDENTITY_SECRET=ci-secret-0123456789abcdef petek:ci --json doctor > doctor.json || true
          cat doctor.json
          jq -e '.checks[] | select(.name == "Chromium") | select(.status == "OK")' doctor.json > /dev/null

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  e2e:
    name: End-to-end against the fake target (real Chromium)
    runs-on: ubuntu-latest
    needs: build
    if: inputs.e2e
    timeout-minutes: 30
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Install the Chromium Playwright needs
        run: |
          PW=$(grep -m1 -E '^playwright = "' gradle/libs.versions.toml | cut -d'"' -f2)
          npx --yes "playwright@${PW}" install --with-deps chromium
      - name: End-to-end runs against the fake target (panel, e2e module, 30 real Chromium contexts)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: ./gradlew e2eTest --no-daemon --console=plain
      - name: Isolation proof at scale (5 000 testers through the orchestrator)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: ./gradlew :features:orchestration:test -Dpetek.isolation.testers=5000 --no-daemon --console=plain
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            app/build/reports/tests/
            app/build/panel-screenshots/
            e2e/build/reports/tests/
            features/browser/build/reports/tests/
            features/orchestration/build/reports/tests/
          retention-days: 7
