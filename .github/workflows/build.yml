name: Build

on:
  push:
    branches: [develop, petek-mvp]
  pull_request:
    branches: [develop, petek-mvp]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, lint, licence headers, unit and architecture tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Install the Chromium Playwright needs (browser tests run in the normal build)
        run: npx --yes playwright@1.63.0 install --with-deps chromium

      - name: Build
        run: ./gradlew build --no-daemon --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  e2e:
    name: End-to-end against the fake target (real Chromium)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 40
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: npx --yes playwright@1.63.0 install --with-deps chromium
      - run: ./gradlew :e2e:e2eTest --no-daemon --console=plain
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: e2e/build/reports/tests/
          retention-days: 7
